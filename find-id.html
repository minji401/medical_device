<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아이디찾기 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="auth-page">
    <div class="wrap">
      <div class="auth-intro">
        <h1>아이디찾기</h1>
        <p>가입할 때 쓴 이름과 휴대폰 번호를 입력해 주세요.</p>
      </div>
      <form class="auth-card" id="find-id-form">
        <h2>아이디찾기</h2>
        <div class="auth-field">
          <label for="find-id-name">이름</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 19c1.4-3.2 4-5 7-5s5.6 1.8 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <input id="find-id-name" name="name" required placeholder="이름" autocomplete="name" />
          </div>
        </div>
        <div class="auth-field">
          <label for="find-id-phone">휴대폰 번호</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <input id="find-id-phone" name="phone" required placeholder="010-0000-0000" autocomplete="tel" />
          </div>
        </div>
        <p class="form-error" id="find-id-error" hidden></p>
        <p class="auth-result" id="find-id-result" hidden></p>
        <button class="auth-submit" type="submit">아이디 찾기</button>
        <nav class="auth-links">
          <a href="login.html">로그인</a>
          <a href="find-password.html">비밀번호찾기</a>
          <a href="signup.html">회원가입</a>
        </nav>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initFindId();</script>
</body>
</html>
