<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 상품</div>
      <h1 id="shop-title">전체 상품</h1>
      <p id="shop-count">상품을 불러오는 중</p>
    </div>
  </section>
  <section class="section" style="padding-top:12px">
    <div class="wrap">
      <div class="filters" id="group-chips"></div>
      <div class="filters" id="mode-chips"></div>
      <div class="filters" id="filter-chips"></div>
      <div class="grid-4" id="shop-grid"></div>
      <nav class="pager" id="shop-pager"></nav>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initShop();</script>
</body>
</html>
