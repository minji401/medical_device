<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 재설정 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="auth-screen">
    <div class="wrap">
      <div class="auth-lead">
        <h1>새 비밀번호</h1>
        <p>메일로 받은 링크는 30분 동안만 사용할 수 있습니다.</p>
      </div>
      <form class="auth-card" id="reset-password-form">
        <h2>비밀번호 재설정</h2>
        <div class="auth-field">
          <label for="new-password">새 비밀번호</label>
          <input id="new-password" name="password" type="password" required placeholder="대문자, 소문자, 숫자, 특수문자 포함 8자 이상" autocomplete="new-password" />
        </div>
        <div class="auth-field">
          <label for="new-password2">비밀번호 확인</label>
          <input id="new-password2" name="passwordConfirm" type="password" required placeholder="비밀번호를 다시 입력해 주세요" autocomplete="new-password" />
        </div>
        <p class="form-error" id="reset-error" hidden></p>
        <button class="btn-auth" type="submit">비밀번호 바꾸기</button>
        <nav class="auth-links">
          <a href="login.html">로그인</a>
          <a href="find-password.html">비밀번호 찾기</a>
        </nav>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initResetPassword();</script>
</body>
</html>
