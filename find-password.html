<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호찾기 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="auth-screen">
    <div class="wrap">
      <div class="auth-lead">
        <h1>비밀번호찾기</h1>
        <p>아이디와 가입 정보를 확인한 뒤 새 비밀번호로 바꿉니다.</p>
      </div>
      <form class="auth-card" id="find-password-form">
        <h2>비밀번호찾기</h2>
        <div class="auth-field">
          <label for="reset-login">아이디</label>
          <span class="auth-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 19c1.4-3.2 4-5 7-5s5.6 1.8 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <input id="reset-login" name="login" required placeholder="아이디 또는 휴대폰번호" autocomplete="username" />
        </div>
        <div class="auth-field">
          <label for="reset-name">이름</label>
          <span class="auth-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 20V8l6-4 6 4v12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          <input id="reset-name" name="name" required placeholder="이름" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label for="reset-phone">휴대폰 번호</label>
          <span class="auth-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <input id="reset-phone" name="phone" required placeholder="010-0000-0000" autocomplete="tel" />
        </div>
        <div class="auth-field">
          <label for="reset-password">새 비밀번호</label>
          <span class="auth-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="10" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 10V8a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input id="reset-password" name="password" type="password" required minlength="8" placeholder="8자 이상" autocomplete="new-password" />
          <button class="auth-eye" type="button" data-toggle-pass="#reset-password" aria-label="비밀번호 보기">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
        <p class="form-error" id="find-password-error" hidden></p>
        <p class="form-ok" id="find-password-result" hidden></p>
        <button class="btn-auth" type="submit">비밀번호 바꾸기</button>
        <nav class="auth-links">
          <a href="login.html">로그인</a>
          <a href="find-id.html">아이디찾기</a>
          <a href="signup.html">회원가입</a>
        </nav>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initFindPassword();</script>
</body>
</html>
