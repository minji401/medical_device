<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호찾기 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="auth-screen">
    <div class="wrap">
      <div class="auth-lead">
        <h1>비밀번호 찾기</h1>
        <p>가입할 때 입력한 이메일로 재설정 링크를 보냅니다. 링크는 30분 동안만 사용할 수 있습니다.</p>
      </div>
      <form class="auth-card" id="find-password-form">
        <h2>비밀번호 찾기</h2>
        <div class="auth-field">
          <label for="reset-email">이메일</label>
          <span class="auth-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input id="reset-email" name="email" type="email" required placeholder="email@example.com" autocomplete="email" />
        </div>
        <p class="form-error" id="find-password-error" hidden></p>
        <p class="form-ok" id="find-password-result" hidden></p>
        <button class="btn-auth" type="submit">재설정 링크 받기</button>
        <p class="auth-help">가입 시 이메일을 등록하지 않은 회원은 고객센터(054-334-9986)로 문의해 주세요. 아래에 이름과 연락처를 남겨 주셔도 됩니다. 확인 후 전화로 안내하며, 이 화면에서 비밀번호가 바로 바뀌지는 않습니다.</p>
      </form>
      <form class="auth-card" id="password-help-form" style="margin-top:16px">
        <h2>이메일 없이 가입한 경우</h2>
        <div class="auth-field">
          <label for="help-name">이름</label>
          <input id="help-name" name="name" type="text" required placeholder="가입할 때 입력한 이름" />
        </div>
        <div class="auth-field">
          <label for="help-phone">연락처</label>
          <input id="help-phone" name="phone" type="tel" required placeholder="010-0000-0000" />
        </div>
        <p class="form-error" id="password-help-error" hidden></p>
        <p class="form-ok" id="password-help-result" hidden></p>
        <button class="btn-auth" type="submit">고객센터에 초기화 요청</button>
        <nav class="auth-links">
          <a href="login.html">로그인</a>
          <a href="find-id.html">아이디찾기</a>
          <a href="signup.html">회원가입</a>
        </nav>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initFindPassword();</script>
</body>
</html>
