<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상담신청 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 상담</div>
      <h1>등급 확인부터 설치까지<br>상담사가 안내합니다</h1>
      <p>평일 09:00–18:00 · 054-334-9986 · 헤리움 케어센터와 같은 자리</p>
    </div>
  </section>
  <section class="section">
    <div class="wrap guide-grid">
      <form class="panel form" id="consult-form">
        <h2>온라인 상담 신청</h2>
        <div class="row">
          <div>
            <label>성함</label>
            <input name="name" required placeholder="홍길동" />
          </div>
          <div>
            <label>연락처</label>
            <input name="phone" required placeholder="010-0000-0000" />
          </div>
        </div>
        <label>관심 품목</label>
        <div class="checks">
          <label class="check"><input type="checkbox" value="전동침대" /> 전동침대</label>
          <label class="check"><input type="checkbox" value="휠체어" /> 휠체어</label>
          <label class="check"><input type="checkbox" value="보행기" /> 보행기</label>
          <label class="check"><input type="checkbox" value="안전손잡이" /> 안전손잡이</label>
          <label class="check"><input type="checkbox" value="혈압계" /> 혈압·혈당</label>
          <label class="check"><input type="checkbox" value="보청기" /> 보청기</label>
          <label class="check"><input type="checkbox" value="전동휠체어" /> 전동휠체어</label>
          <label class="check"><input type="checkbox" value="생활용품" /> 노인생활용품</label>
          <label class="check"><input type="checkbox" value="기타" /> 기타</label>
        </div>
        <label>문의 내용</label>
        <textarea id="message" name="message" placeholder="어르신의 거동 상태, 배송 지역을 알려 주세요."></textarea>
        <label class="check" style="margin:14px 0">
          <input type="checkbox" name="agree" /> 개인정보 수집 및 이용에 동의합니다. (상담 목적, 문의 처리 후 파기)
        </label>
        <button class="btn btn-teal btn-lg" type="submit">상담 신청하기</button>
      </form>
      <div class="panel">
        <h2>이런 안내를 드립니다</h2>
        <ul class="spec">
          <li><span>급여 조회</span><b>잔여 한도와 본인부담률 확인</b></li>
          <li><span>방문 설치</span><b>영천·경산·대구 전동침대·손잡이</b></li>
          <li><span>당일출고</span><b>평일 12시 이전 주문</b></li>
          <li><span>위생 관리</span><b>대여 제품 소독·회수</b></li>
        </ul>
        <div class="cta-actions" style="margin-top:24px">
          <a class="btn btn-gold" href="tel:054-334-9986">전화 054-334-9986</a>
          <a class="btn btn-outline" href="shop.html">상품 다시 보기</a>
        </div>
      </div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initConsult();</script>
</body>
</html>
