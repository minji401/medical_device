<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마이페이지 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 마이페이지</div>
      <h1>마이페이지</h1>
      <p id="account-lead">주문·상담 접수 내역을 확인합니다. 결제는 아직 상담 후 진행합니다.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="account-head panel">
        <div>
          <h2 id="account-name">로그인 확인 중</h2>
          <p id="account-phone" class="muted"></p>
        </div>
        <button class="btn btn-outline" id="logout-btn" type="button">로그아웃</button>
      </div>
      <form class="panel form" id="profile-form" style="margin-top:18px">
        <h2>내 정보</h2>
        <p class="muted">의료기에서 보는 이름입니다. 헤리움 보호자 성함과는 따로 수정됩니다.</p>
        <label>아이디</label>
        <input name="username" readonly />
        <label>이름</label>
        <input name="name" required placeholder="이름" />
        <label>휴대폰 번호</label>
        <input name="phone" required placeholder="010-0000-0000" />
        <label>배송·설치 주소</label>
        <input name="address" placeholder="다음 주문에 미리 넣어 둡니다" />
        <label>현재 비밀번호</label>
        <input name="currentPassword" type="password" placeholder="비밀번호를 바꿀 때만 입력" />
        <label>새 비밀번호</label>
        <input name="newPassword" type="password" minlength="8" placeholder="8자 이상, 바꾸지 않으면 비워 두세요" />
        <p class="form-error" id="profile-error" hidden></p>
        <button class="btn btn-teal" type="submit" style="margin-top:12px">저장</button>
      </form>
      <div class="section-head" style="margin-top:32px">
        <div>
          <h2>주문·상담 내역</h2>
          <p>접수되면 사업소에서 연락드립니다.</p>
        </div>
      </div>
      <div id="order-list"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initAccount();</script>
</body>
</html>
