<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="auth-page">
    <div class="wrap">
      <div class="auth-intro">
        <h1>안전하고 편안한 현대 의료기</h1>
        <p>아이디와 휴대폰 번호로 가입하면 의료기 주문을 바로 이용할 수 있습니다.<br>헤리움 회원이면 여기서 다시 가입하지 말고 로그인하세요.</p>
      </div>
      <form class="auth-card" id="signup-form">
        <h2>회원가입</h2>
        <div class="auth-field">
          <label for="signup-username">아이디</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 19c1.4-3.2 4-5 7-5s5.6 1.8 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <input id="signup-username" name="username" required minlength="4" maxlength="20" placeholder="아이디" autocomplete="username" />
          </div>
        </div>
        <div class="auth-field">
          <label for="signup-name">이름</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 20V8l6-4 6 4v12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </span>
            <input id="signup-name" name="name" required placeholder="이름" autocomplete="name" />
          </div>
        </div>
        <div class="auth-field">
          <label for="signup-phone">휴대폰 번호</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <input id="signup-phone" name="phone" required placeholder="010-0000-0000" autocomplete="tel" />
          </div>
        </div>
        <div class="auth-field">
          <label for="signup-password">비밀번호</label>
          <div class="auth-input">
            <span class="ico" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="6" y="10" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 10V8a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8"/></svg>
            </span>
            <input id="signup-password" name="password" type="password" required minlength="8" placeholder="8자 이상" autocomplete="new-password" />
            <button class="pw-toggle" type="button" data-toggle-pw aria-label="비밀번호 보기">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" id="signup-error" hidden></p>
        <button class="auth-submit" type="submit">가입하기</button>
        <nav class="auth-links">
          <a href="login.html">로그인</a>
          <a href="find-password.html">비밀번호찾기</a>
          <a href="find-id.html">아이디찾기</a>
        </nav>
        <div class="auth-social">
          <a class="social-btn social-kakao" data-social="kakao" href="/api/auth/kakao">카카오로 시작하기</a>
          <a class="social-btn social-naver" data-social="naver" href="/api/auth/naver">네이버로 시작하기</a>
          <a class="social-btn social-google" data-social="google" href="/api/auth/google">Google로 시작하기</a>
        </div>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initSignup();</script>
</body>
</html>
