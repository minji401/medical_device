<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 회원가입</div>
      <h1>회원가입</h1>
      <p>휴대폰 번호로 가입하면 주문 내역을 확인할 수 있습니다.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap auth-wrap">
      <form class="panel form" id="signup-form">
        <label>이름</label>
        <input name="name" required placeholder="홍길동" autocomplete="name" />
        <label>휴대폰 번호</label>
        <input name="phone" required placeholder="010-0000-0000" autocomplete="tel" />
        <label>비밀번호</label>
        <input name="password" type="password" required minlength="8" placeholder="8자 이상" autocomplete="new-password" />
        <p class="form-error" id="signup-error" hidden></p>
        <button class="btn btn-teal btn-lg" type="submit" style="width:100%;margin-top:18px">가입하기</button>
        <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initSignup();</script>
</body>
</html>
