<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문/배송 조회 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 마이페이지 · 주문/배송 조회</div>
      <h1>주문/배송 조회 및 관리</h1>
      <p id="orders-lead">상태·기간·검색으로 주문을 찾고, 엑셀로 정리할 수 있습니다.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <article class="panel mypage-card">
        <div class="orders-toolbar">
          <a class="btn btn-outline" href="mypage.html">← 마이페이지로 돌아가기</a>
          <div class="orders-toolbar-actions">
            <button class="btn btn-teal" type="button" id="orders-xlsx-btn">엑셀로 정리/다운로드 (.xlsx)</button>
          </div>
        </div>

        <div class="order-status-filters" id="order-status-filters" role="tablist" aria-label="주문 상태 필터"></div>

        <div class="orders-controls">
          <label for="order-range">기간
            <select id="order-range">
              <option value="365" selected>최근 1년(기본값)</option>
              <option value="90">최근 3개월</option>
              <option value="180">최근 6개월</option>
              <option value="1825">전체 내역(최대 5년)</option>
            </select>
          </label>
          <label for="order-sort">정렬
            <select id="order-sort">
              <option value="desc" selected>최신 주문순</option>
              <option value="asc">과거 주문순</option>
            </select>
          </label>
          <label for="order-search">검색
            <input id="order-search" type="search" placeholder="주문번호 · 주문자명 · 상품명" autocomplete="off" />
          </label>
        </div>
        <p class="muted orders-count" id="orders-count"></p>
        <div id="order-manage-list"></div>
      </article>
    </div>
  </section>

  <div id="admin-cancel-modal" class="admin-modal" hidden>
    <div class="admin-modal-dim" data-cancel-modal-close></div>
    <div class="admin-modal-box" role="dialog" aria-labelledby="admin-cancel-title">
      <h2 id="admin-cancel-title">관리자 직권 취소</h2>
      <p class="muted">토스 결제를 환불하고 재고를 되돌립니다. 배송 중인 주문은 취소할 수 없습니다.</p>
      <form class="form" id="admin-cancel-form">
        <input type="hidden" name="order_id" />
        <label for="admin-cancel-reason">취소 사유</label>
        <select id="admin-cancel-reason" name="reason" required>
          <option value="">사유를 선택해 주세요</option>
          <option>고객 유선(전화) 취소 요청</option>
          <option>상품 품절 / 단종</option>
          <option>배송 / 설치 불가 (지역 또는 엘리베이터 없음 등)</option>
          <option>상품 검수 불량 / 하자 발견</option>
          <option>기타 (직접 입력)</option>
        </select>
        <label for="admin-cancel-detail">상세 사유 (선택)</label>
        <textarea id="admin-cancel-detail" name="detailReason" placeholder="필요한 경우 자세한 내용을 적어 주세요."></textarea>
        <p class="form-error" id="admin-cancel-error" hidden></p>
        <div class="order-actions">
          <button class="btn btn-outline" type="button" data-cancel-modal-close>닫기</button>
          <button class="btn btn-danger" type="submit">취소 및 환불 실행</button>
        </div>
      </form>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initOrders();</script>
</body>
</html>
