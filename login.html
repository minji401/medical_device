<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 로그인</div>
      <h1>로그인</h1>
      <p>주문 조회와 장바구니 주문을 위해 로그인해 주세요.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap auth-wrap">
      <form class="panel form" id="login-form">
        <label>휴대폰 번호</label>
        <input name="phone" required placeholder="010-0000-0000" autocomplete="username" />
        <label>비밀번호</label>
        <input name="password" type="password" required minlength="8" placeholder="8자 이상" autocomplete="current-password" />
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn btn-teal btn-lg" type="submit" style="width:100%;margin-top:18px">로그인</button>
        <p class="auth-switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initLogin();</script>
</body>
</html>
