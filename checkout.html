<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문 접수 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs">홈 · 주문</div>
      <h1>주문 접수</h1>
      <p>지금은 결제 없이 주문만 접수합니다. 확인 후 본인부담·배송을 안내드립니다.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap guide-grid">
      <div class="panel">
        <h2>담은 상품</h2>
        <div id="checkout-items"></div>
        <div class="cart-total" id="checkout-total"></div>
      </div>
      <form class="panel form" id="checkout-form">
        <h2>배송·연락 정보</h2>
        <label>이름</label>
        <input name="name" required placeholder="홍길동" />
        <label>휴대폰 번호</label>
        <input name="phone" required placeholder="010-0000-0000" />
        <label>배송·설치 주소</label>
        <input name="address" required placeholder="경북 영천시 …" />
        <label>요청 사항</label>
        <textarea name="memo" placeholder="방문 시간, 설치 장소, 등급 여부를 적어 주세요."></textarea>
        <p class="form-error" id="checkout-error" hidden></p>
        <button class="btn btn-teal btn-lg" type="submit" style="width:100%;margin-top:18px">주문 접수하기</button>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initCheckout();</script>
</body>
</html>
