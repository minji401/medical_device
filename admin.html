<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 | 현대 의료기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="wrap">
      <h1 id="admin-hero-title">관리자 로그인</h1>
      <p id="admin-hero-lead">헤리움 관리자 계정으로 로그인해 주세요.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="panel" id="admin-gate" hidden>
        <h2>관리자 로그인이 필요합니다</h2>
        <p class="muted">헤리움 관리자 계정으로 로그인한 뒤 이 페이지를 이용할 수 있습니다.</p>
        <p class="form-error" id="admin-login-error" hidden></p>
        <form class="form" id="admin-login-form">
          <label for="admin-login-id">아이디 또는 이메일</label>
          <input id="admin-login-id" name="login" required autocomplete="username" />
          <label for="admin-login-password">비밀번호</label>
          <input id="admin-login-password" name="password" type="password" required autocomplete="current-password" />
          <button class="btn btn-teal" type="submit" style="margin-top:12px">관리자 로그인</button>
        </form>
        <p style="margin-top:12px"><a class="btn btn-outline" id="admin-login-page" href="login.html">로그인 페이지로 이동</a></p>
      </div>
      <div id="admin-dashboard" hidden>
      <div class="panel">
        <h2>주문·배송 관리</h2>
        <label>상태 필터
          <select id="admin-order-status"></select>
        </label>
        <div id="admin-orders" style="margin-top:12px"></div>
      </div>
      <div class="panel" id="admin-low"></div>
      <form class="panel form" id="product-form">
        <h2>상품 등록/수정</h2>
        <label>상품 ID</label>
        <input name="id" required />
        <label>상품명</label>
        <input name="name" required />
        <label>판매가</label>
        <input name="price" type="number" required />
        <label>할인가</label>
        <input name="sale_price" type="number" />
        <label>재고</label>
        <input name="stock" type="number" value="0" />
        <label>카테고리</label>
        <input name="category" />
        <div class="form-checks">
          <label class="check"><input type="checkbox" name="is_hygiene_product" /> 위생용품(개봉 시 반품 제한)</label>
          <label class="check"><input type="checkbox" name="is_active" checked /> 판매 중</label>
        </div>
        <button class="btn btn-teal" type="submit">저장</button>
        <p class="form-error" id="admin-error" hidden></p>
      </form>
      <form class="panel form" id="company-form">
        <h2>회사 정보</h2>
        <label>상호명</label>
        <input name="shop_company_name" placeholder="[상호명]" />
        <label>대표자</label>
        <input name="shop_owner" placeholder="[대표자 성명]" />
        <label>개인정보보호책임자</label>
        <input name="shop_privacy_officer" placeholder="[책임자 성명]" />
        <label>사업자번호</label>
        <input name="shop_biz_no" />
        <label>통신판매업신고번호</label>
        <input name="shop_online_sales_no" />
        <label>의료기기판매업신고번호</label>
        <input name="shop_medical_sales_no" />
        <label>고객센터</label>
        <input name="shop_phone" placeholder="[전화번호]" />
        <label>이메일</label>
        <input name="shop_email" placeholder="[고객센터 이메일]" />
        <label>사업장 소재지</label>
        <input name="shop_address" placeholder="[사업장 주소 입력]" />
        <button class="btn btn-teal" type="submit">회사 정보 저장</button>
      </form>
      </div>
    </div>
  </section>
  <div id="admin-cancel-modal" class="admin-modal" hidden>
    <div class="admin-modal-dim" data-cancel-modal-close></div>
    <div class="admin-modal-box" role="dialog" aria-labelledby="admin-cancel-title">
      <h2 id="admin-cancel-title">관리자 직권 취소</h2>
      <p class="muted">토스 결제를 환불하고 재고를 되돌립니다. 배송 중인 주문은 취소할 수 없습니다.</p>
      <form class="form" id="admin-cancel-form">
        <input type="hidden" name="order_id" />
        <label for="admin-cancel-reason">취소 사유</label>
        <select id="admin-cancel-reason" name="reason" required>
          <option value="">사유를 선택해 주세요</option>
          <option>고객 유선(전화) 취소 요청</option>
          <option>상품 품절 / 단종</option>
          <option>배송 / 설치 불가 (지역 또는 엘리베이터 없음 등)</option>
          <option>상품 검수 불량 / 하자 발견</option>
          <option>기타 (직접 입력)</option>
        </select>
        <label for="admin-cancel-detail">상세 사유 (선택)</label>
        <textarea id="admin-cancel-detail" name="detailReason" placeholder="필요한 경우 자세한 내용을 적어 주세요."></textarea>
        <p class="form-error" id="admin-cancel-error" hidden></p>
        <div class="order-actions">
          <button class="btn btn-outline" type="button" data-cancel-modal-close>닫기</button>
          <button class="btn btn-danger" type="submit">취소 및 환불 실행</button>
        </div>
      </form>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>Oncare.initAdmin();</script>
</body>
</html>
